[project]
name = "buildseo-backend"
version = "0.1.0"
description = "Multi-tenant SaaS backend for discovering, qualifying and submitting links to free online listing/directory sites."
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "greenlet>=3.1.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "idna>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.7.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "types-python-dateutil>=2.9.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "S",    # bandit
    "ASYNC",# flake8-async
    "T20",  # no print
    "RUF",
]
ignore = [
    "B008",   # FastAPI dependency injection idiom: function call in default argument
    "S101",   # asserts are fine in tests
    "UP046",  # keep Generic[T]: the documented form for Pydantic v2 generic models
    "UP047",  # ditto for generic functions
]

[tool.ruff.lint.per-file-ignores]
# S104/S105/S106 flag literal addresses and password-shaped strings that are
# test fixtures; S311 allows non-crypto randomness in test data.
"tests/*" = ["S104", "S105", "S106", "S311"]
# S105 flags any string constant whose name contains TOKEN or PASSWORD. These
# modules define audit action codes, a JWT claim discriminator and session
# revocation reasons -- none of them secrets.
"app/audit/actions.py" = ["S105"]
"app/core/security/jwt.py" = ["S105"]
"app/auth/service.py" = ["S105"]
"scripts/*" = ["T201"]
"app/rbac/catalog.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = false
ignore_missing_imports = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["app.models.*", "migrations.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: pure logic tests, no database",
    "integration: requires PostgreSQL",
    "security: tenant isolation / authz / secret leakage tests",
    "api: end-to-end HTTP tests",
]
filterwarnings = ["error::DeprecationWarning:app.*"]
